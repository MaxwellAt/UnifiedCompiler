[package]
name = "unicomp"
version = "0.1.0"
edition = "2021"
authors = ["Jêfferson Maxwell", "UnifiedCompiler Contributors"]
description = "Universal Distributed Compiler and Remote Execution Engine"
license = "AGPL-3.0-or-later"
repository = "https://github.com/MaxwellAt/UnifiedCompiler"


[dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "sync", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
sha2 = "0.10"
hex = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
anyhow = "1.0"
ignore = "0.4"
